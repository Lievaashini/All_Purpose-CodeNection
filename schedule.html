<script>
  // Theme Toggle Functionality - Default Bright
  function toggleTheme() {
    const body = document.body;
    const isDark = body.classList.toggle('dark-mode');
    const toggleIcon = document.getElementById('theme-toggle-icon');
    const toggleLabel = document.getElementById('theme-toggle-label');
    const html = document.documentElement;

    if (isDark) {
      body.setAttribute('data-theme', 'dark');
      html.classList.add('dark');
      html.classList.remove('light');
      if (toggleIcon) toggleIcon.textContent = 'light_mode';
      if (toggleLabel) toggleLabel.textContent = 'Bright';
    } else {
      body.removeAttribute('data-theme');
      html.classList.remove('dark');
      html.classList.add('light');
      if (toggleIcon) toggleIcon.textContent = 'dark_mode';
      if (toggleLabel) toggleLabel.textContent = 'Night';
    }
  }
  window.toggleTheme = toggleTheme;

  (function() {
    const cards = document.querySelectorAll('.tone-card');
    const dialogue = document.getElementById('dino-dialogue');
    const avatar = document.getElementById('dino-avatar');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Reset all cards
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-[#F0FDF4]', 'border-[#22C55E]', 'shadow-[0_4px_14px_-2px_rgba(34,197,94,0.2)]');
          c.classList.add('bg-white', 'border-[#E2E8F0]', 'opacity-90');
          const ind = c.querySelector('.radio-indicator');
          ind.className = 'radio-indicator shrink-0 w-6 h-6 rounded-full bg-[#F1F5F9] text-[#94A3B8] flex items-center justify-center';
          const chk = ind.querySelector('.material-symbols-outlined');
          if (chk) chk.classList.add('hidden');
        });

        // Activate clicked card
        card.setAttribute('aria-checked', 'true');
        card.classList.remove('bg-white', 'border-[#E2E8F0]', 'opacity-90');
        card.classList.add('bg-[#F0FDF4]', 'border-[#22C55E]', 'shadow-[0_4px_14px_-2px_rgba(34,197,94,0.2)]');
        
        const ind = card.querySelector('.radio-indicator');
        ind.className = 'radio-indicator shrink-0 w-6 h-6 rounded-full bg-[#22C55E] text-white flex items-center justify-center';
        const chk = ind.querySelector('.material-symbols-outlined');
        if (chk) chk.classList.remove('hidden');

        // Update Speech Bubble
        const speech = card.getAttribute('data-speech');
        if (dialogue && speech) {
          dialogue.textContent = `"${speech}"`;
          if (avatar) {
            avatar.classList.add('scale-125');
            setTimeout(() => avatar.classList.remove('scale-125'), 200);
          }
        }
      });
    });

    // Health Connect toggle micro-interaction
    const healthBtn = document.getElementById('health-connect-btn');
    const healthDot = document.getElementById('health-status-dot');
    const healthText = document.getElementById('health-status-text');
    let connected = false;

    if (healthBtn && healthDot && healthText) {
      healthBtn.addEventListener('click', () => {
        connected = !connected;
        if (connected) {
          healthDot.classList.remove('bg-[#94A3B8]', 'animate-ping');
          healthDot.classList.add('bg-[#10B981]');
          healthText.textContent = 'READY';
          healthText.classList.remove('text-[#64748B]');
          healthText.classList.add('text-[#047857]');
        } else {
          healthDot.classList.remove('bg-[#10B981]');
          healthDot.classList.add('bg-[#94A3B8]', 'animate-ping');
          healthText.textContent = 'LINK';
          healthText.classList.remove('text-[#047857]');
          healthText.classList.add('text-[#64748B]');
        }
      });
    }
  })();
