<script>
  // Theme Toggle Functionality
  function toggleTheme() {
    const body = document.body;
    const isBright = body.classList.toggle('bright-mode');
    const toggleIcon = document.getElementById('theme-toggle-icon');
    const toggleLabel = document.getElementById('theme-toggle-label');
    const html = document.documentElement;

    if (isBright) {
      body.setAttribute('data-theme', 'bright');
      html.classList.remove('dark');
      if (toggleIcon) toggleIcon.textContent = 'dark_mode';
      if (toggleLabel) toggleLabel.textContent = 'Night';
    } else {
      body.removeAttribute('data-theme');
      html.classList.add('dark');
      if (toggleIcon) toggleIcon.textContent = 'light_mode';
      if (toggleLabel) toggleLabel.textContent = 'Bright';
    }
  }
  window.toggleTheme = toggleTheme;

  (function() {
    const cards = document.querySelectorAll('.tone-card');
    const dialogue = document.getElementById('dino-dialogue');
    const avatar = document.getElementById('dino-avatar');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Reset all cards
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.classList.remove('bg-surface-container');
          c.classList.add('bg-surface-container-low', 'opacity-85');
          const ind = c.querySelector('.radio-indicator');
          ind.className = 'radio-indicator shrink-0 w-6 h-6 rounded-full bg-surface-container-highest text-outline flex items-center justify-center';
          const chk = ind.querySelector('.material-symbols-outlined');
          if (chk) chk.classList.add('hidden');
        });

        // Activate clicked card
        card.setAttribute('aria-checked', 'true');
        card.classList.remove('bg-surface-container-low', 'opacity-85');
        card.classList.add('bg-surface-container');
        
        const ind = card.querySelector('.radio-indicator');
        ind.className = 'radio-indicator shrink-0 w-6 h-6 rounded-full bg-primary-container text-surface flex items-center justify-center';
        const chk = ind.querySelector('.material-symbols-outlined');
        if (chk) chk.classList.remove('hidden');

        // Update Speech Bubble
        const speech = card.getAttribute('data-speech');
        if (dialogue && speech) {
          dialogue.textContent = `"${speech}"`;
          if (avatar) {
            avatar.classList.add('scale-125');
            setTimeout(() => avatar.classList.remove('scale-125'), 200);
          }
        }
      });
    });

    // Health Connect toggle micro-interaction
    const healthBtn = document.getElementById('health-connect-btn');
    const healthDot = document.getElementById('health-status-dot');
    const healthText = document.getElementById('health-status-text');
    let connected = false;

    if (healthBtn && healthDot && healthText) {
      healthBtn.addEventListener('click', () => {
        connected = !connected;
        if (connected) {
          healthDot.classList.remove('bg-outline', 'animate-ping');
          healthDot.classList.add('bg-primary');
          healthText.textContent = 'READY';
          healthText.classList.remove('text-outline-variant');
          healthText.classList.add('text-primary');
        } else {
          healthDot.classList.remove('bg-primary');
          healthDot.classList.add('bg-outline', 'animate-ping');
          healthText.textContent = 'LINK';
          healthText.classList.remove('text-primary');
          healthText.classList.add('text-outline-variant');
        }
      });
    }
  })();
</script></main>

<script>
(function(){
const mainMic=document.getElementById('voice-mic-btn'),popup=document.getElementById('voice-popup'),closeBtn=document.getElementById('voice-back-btn'),popupMic=document.getElementById('popup-mic-btn'),status=document.getElementById('voice-status'),command=document.getElementById('voice-command'),ready=document.getElementById('voice-ready'),themeBtn=document.getElementById('voice-theme-btn'),themeIcon=document.getElementById('voice-theme-icon');
let recognition=null,listening=false;
function openVoice(){popup.classList.add('open');popup.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeVoice(){if(recognition)try{recognition.stop()}catch(e){};setListening(false);popup.classList.remove('open');popup.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function setListening(on){listening=on;[mainMic,popupMic].forEach(e=>e&&e.classList.toggle('listening',on));if(status)status.textContent=on?'LISTENING':'VOICE READY';if(ready)ready.textContent=on?'SPEAK NOW':'READY TO LISTEN'}
function navigate(s){
s=s.toLowerCase();
let p=null;
if(/\b(dashboard|home)\b/.test(s))p='dashboard.html';
else if(/\b(add|new)\s+(a\s+)?task\b|\bcreate\s+(a\s+)?task\b/.test(s))p='add-task.html';
else if(/\b(schedule|reschedule|shift|calendar)\b/.test(s))p='schedule.html';
else if(/\b(biometric|biometrics|health|sleep|hrv|heart rate)\b/.test(s))p='biometrics.html';
else if(/\b(settings|privacy)\b/.test(s))p='settings.html';
else if(/\b(daily|harvest)\b/.test(s))p='daily-harvest.html';
else if(/\b(weekly|feast)\b/.test(s))p='feast.html';
else if(/\bhard limits?\b/.test(s))p='hard-limits.html';
if(p){command.textContent='"Opening '+p.replace('.html','')+'..."';setTimeout(()=>location.href=p,350);return true}
return false
}
function startListening(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){status.textContent='VOICE UNAVAILABLE';ready.textContent='USE A SUPPORTED BROWSER';return}
if(listening){if(recognition)try{recognition.stop()}catch(e){};return}
recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;
recognition.onstart=()=>setListening(true);
recognition.onresult=e=>{const heard=e.results[0][0].transcript.trim();command.textContent='"'+heard+'"';setListening(false);if(!navigate(heard)){status.textContent='COMMAND RECEIVED';ready.textContent='TRY: "OPEN DASHBOARD"'}};
recognition.onerror=e=>{setListening(false);command.textContent=e.error==='not-allowed'?'"Microphone permission is required."':'"I didn’t catch that. Try again."'};
recognition.onend=()=>setListening(false);
try{recognition.start()}catch(e){setListening(false)}
}
if(mainMic)mainMic.onclick=openVoice;
if(popupMic)popupMic.onclick=startListening;
if(closeBtn)closeBtn.onclick=closeVoice;
if(popup)popup.onclick=e=>{if(e.target===popup)closeVoice()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&popup.classList.contains('open'))closeVoice()});
if(themeBtn)themeBtn.onclick=()=>{if(typeof window.toggleTheme==='function')window.toggleTheme();themeIcon.textContent=document.body.classList.contains('bright-mode')?'dark_mode':'light_mode'};
})();
</script>
