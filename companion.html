<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,sans-serif;background:#080a0a;color:#e3e2e2}body{display:flex;justify-content:center;min-height:100vh;overflow:hidden}button{font:inherit;border:0;cursor:pointer}.mono{font-family:'Space Mono',monospace}
.app{width:390px;height:844px;max-width:100vw;position:relative;background:#121414;border:8px solid #171a1a;border-radius:42px;overflow:hidden;box-shadow:0 0 0 1px #202525 inset,0 20px 60px rgba(0,0,0,.45)}
.screen{height:100%;display:flex;flex-direction:column;align-items:center;position:relative;padding:40px 34px 28px}
.top{width:100%;display:grid;grid-template-columns:60px 1fr 60px;align-items:center}
.circle{width:60px;height:60px;border-radius:50%;background:#242827;border:1px solid #4b514f;color:#e3e2e2;display:flex;align-items:center;justify-content:center}
.circle .material-symbols-outlined{font-size:30px}
.brand{justify-self:center;height:44px;padding:0 20px;border-radius:24px;background:#242827;border:1px solid #4b514f;display:flex;align-items:center;gap:9px;color:#e3e2e2;font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.05em}
.brand-mark{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:#0d1010;border:1px solid #334338;color:#75ff9e;font-size:13px}
.bubble{margin-top:80px;min-width:280px;padding:20px 24px;border-radius:22px;background:#2d302f;border:1px solid #4a4e4c;color:#f0f1ef;font-family:'Space Mono',monospace;font-weight:700;font-size:16px;line-height:1.25;text-align:center;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.chev{margin-top:36px;color:#dfe9df;font-size:22px}
.dino-card{margin-top:60px;width:240px;height:240px;border-radius:34px;background:linear-gradient(135deg,#202722,#151a18);border:1px solid #303833;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 20px 35px rgba(0,0,0,.28)}
.dino-card::before{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(0,230,118,.14);filter:blur(30px)}
.dino{position:relative;width:170px;height:170px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 12px rgba(0,230,118,.35))}
.status{margin-top:48px;padding:9px 18px;border-radius:20px;border:1px solid #3d704c;color:#75ff9e;background:#1a231d;font:700 14px 'Space Mono',monospace;letter-spacing:.08em}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#75ff9e;margin-right:8px}
.instruction{margin-top:88px;color:#dce7dc;font:700 16px 'Space Mono',monospace;letter-spacing:.08em;text-align:center}
.mic-wrap{margin-top:12px;width:190px;height:190px;border-radius:50%;background:#18201b;display:flex;align-items:center;justify-content:center}
.mic{width:144px;height:144px;border-radius:50%;background:#75e37f;border:5px solid #a1f3a8;color:#0c2814;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(0,0,0,.08) inset,0 10px 25px rgba(0,230,118,.12);transition:transform .15s}
.mic:active{transform:scale(.96)}.mic .material-symbols-outlined{font-size:60px}
.ready{margin-top:10px;color:#d8e3d8;font:700 16px 'Space Mono',monospace;letter-spacing:.08em}
.bright .app{background:#f8fafc;color:#0f172a;border-color:#e2e8f0}.bright .circle,.bright .brand{background:#fff;border-color:#cbd5e1;color:#0f172a}.bright .bubble{background:#fff;border-color:#e2e8f0;color:#0f172a}.bright .dino-card{background:#fff;border-color:#e2e8f0}.bright .status{background:#f0fdf4;border-color:#86efac;color:#047857}.bright .instruction,.bright .ready{color:#0f172a}.bright .mic-wrap{background:#e8f7eb}
@media(max-height:700px){.bubble{margin-top:30px}.dino-card{margin-top:30px;width:190px;height:190px}.dino{width:135px;height:135px}.status{margin-top:22px}.instruction{margin-top:38px}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="screen">
  <div class="top">
    <button class="circle" id="backBtn" aria-label="Back"><span class="material-symbols-outlined">arrow_back</span></button>
    <button class="brand" id="homeBrand" aria-label="CapCoach home"><span class="brand-mark">◒</span><span>CAPCOACH</span></button>
    <button class="circle" id="themeBtn" aria-label="Bright mode"><span class="material-symbols-outlined">light_mode</span></button>
  </div>
  <div class="bubble" id="commandBubble">"Hey Dino, reschedule my shift"</div>
  <div class="chev">⌄</div>
  <div class="dino-card"><img class="dino" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjDE7EnyIUq4N3l7mZ2hiRCn7xLR7vjuSBkRmzWjpndkSwZaVJBYGldcAHI7CtQZ7OL-JKGIO8hDKI6JLeddqgHjNgE8hNvS-82Gdm7igkO0xPQ0Ct2OcAXCrzY4NIiks7uWgRoiwhKJPlbZiqXVWpgSxhv0Q48hb7b0du1gFzaeiBbj8FE9o-tv6lixdRJpQ8hlh-fEyxzdzML7-ibfDbLPOgSAkN_GKgSILoQtlHdRKesSeW2GjiV0gtgHCErF2yXg" alt="CapCoach Dino"></div>
  <div class="status"><span class="status-dot"></span><span id="voiceStatus">VOICE READY</span></div>
  <div class="instruction">TAP MICROPHONE TO TALK</div>
  <div class="mic-wrap"><button class="mic" id="micBtn" aria-label="Tap microphone to talk"><span class="material-symbols-outlined">mic</span></button></div>
  <div class="ready" id="readyText">READY TO LISTEN</div>
</div>
</div>
<script>
(function(){
 const mic=document.getElementById('micBtn'), bubble=document.getElementById('commandBubble'), status=document.getElementById('voiceStatus'), ready=document.getElementById('readyText');
 const back=document.getElementById('backBtn'), brand=document.getElementById('homeBrand'), theme=document.getElementById('themeBtn'), body=document.body;
 const embedded=window.parent && window.parent!==window;
 const go=p=>window.location.href=p;
 const closeOrHome=()=>{ if(embedded) window.parent.postMessage('capcoach-close-voice','*'); else go('dashboard.html'); };
 back.addEventListener('click',closeOrHome); brand.addEventListener('click',()=>go('dashboard.html'));
 theme.addEventListener('click',()=>{ body.classList.toggle('bright'); });
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 let rec=null;
 if(SR){
   rec=new SR(); rec.lang='en-US'; rec.interimResults=false; rec.continuous=false;
   rec.onstart=()=>{status.textContent='VOICE READY'; ready.textContent='LISTENING'; mic.classList.add('pulse')};
   rec.onend=()=>{ready.textContent='READY TO LISTEN'; mic.classList.remove('pulse')};
   rec.onerror=()=>{ready.textContent='READY TO LISTEN'; bubble.textContent='"Tap microphone to try again"';};
   rec.onresult=e=>{
     const text=e.results[0][0].transcript.trim(); bubble.textContent='"'+text+'"'; const q=text.toLowerCase();
     if(/\b(go )?(home|dashboard|main page)\b/.test(q)) return go('dashboard.html');
     if(/\b(add|create)( a)? task\b|\bnew task\b/.test(q)) return go('add-task.html');
     if(/\b(schedule|reschedule|shift|calendar)\b/.test(q)) return go('schedule.html');
     if(/\b(biometrics?|health|sleep|hrv)\b/.test(q)) return go('biometrics.html');
     if(/\b(settings?|privacy)\b/.test(q)) return go('settings.html');
     if(/\bdaily (pop[- ]?up|harvest)\b/.test(q)) return go('daily-harvest.html');
     if(/\bweekly (pop[- ]?up|feast)\b|\bfeast\b/.test(q)) return go('feast.html');
     if(/\bhard limits?\b/.test(q)) return go('hard-limits.html');
     if(/\b(back|close)\b/.test(q)) return closeOrHome();
   };
 }
 mic.addEventListener('click',()=>{ if(!rec){bubble.textContent='"Voice input is unavailable in this browser"';return;} try{rec.start()}catch(e){} });
})();
</script>
</body></html>
